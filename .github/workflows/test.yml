name: Test Analyze Database Changes
on: [pull_request]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print working directory
        run: pwd && ls -la
      - name: Start Services
        run: docker compose up -d
      - name: wait ten seconds
        run: sleep 10
      - name: Migrate Database
        run: cd tester && go run main.go
      - name: Dump Schema For SQL Proxy
        run: |
          curl -X POST http://localhost:12345/schema_dump
      - name: Run test suite
        run: cd tester && go test -v
      - name: Get SQL data
        uses: droptableifexists/recon@main
        id: get-sql-data
        with:
          SKIP_SCHEMA_DUMP: false
          SQL_PROXY_API_ADDRESS: localhost:12345
          DEFAULT_DATABASE: defaultdb
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save SQL data to file
        if: always() && github.ref != 'refs/heads/main'
        run: |
          # The recon action should create all four files - check if they exist and create empty ones if missing
          for file in sql-queries.json queries-diff.json full-schema.json schema-diff.json; do
            if [ ! -f "$file" ]; then
              echo "Warning: $file not found, creating empty object"
              echo '{}' > "$file"
            fi
          done
          # Use jq to properly combine all four JSON files into the expected structure
          jq -n \
            --slurpfile sql_queries sql-queries.json \
            --slurpfile queries_diff queries-diff.json \
            --slurpfile schema full-schema.json \
            --slurpfile schema_diff schema-diff.json \
            '{
              "sql_queries": $sql_queries[0],
              "queries_diff": $queries_diff[0],
              "schema": $schema[0],
              "schema_diff": $schema_diff[0]
            }' > analysis_input.json
          echo "Created analysis_input.json:"
          cat analysis_input.json
      - name: Run Database Analysis
        uses: ./
        with:
          message: "Analyzing database changes..."
          input_file: analysis_input.json
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          launchdarkly_sdk_key: ${{ secrets.LAUNCHDARKLY_SDK_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pull_request_number: ${{ github.event.pull_request.number }}
      - name: Stop Services
        run: docker compose down
