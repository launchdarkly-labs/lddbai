name: Analyze Database Changes
description: Analyze database schema and query differences with OpenAI recommendations.

# Inputs for the action
inputs:
  message:
    description: 'Custom message to display during analysis.'
    required: false
    default: 'Running database analysis...'
  input_file:
    description: 'Path to input JSON file for analysis.'
    required: true
  openai_api_key:
    description: 'OpenAI API Key for accessing GPT models.'
    required: true
  github_token:
    description: 'GitHub token for creating/updating PR comments.'
    required: true
    default: ""
  pull_request_number:
    description: 'The pull request number where the comment should be added.'
    required: true
  launchdarkly_sdk_key:
    description: 'LaunchDarkly SDK Key for AI client integration.'
    required: false

# Configuration for composite workflow steps
runs:
  using: 'composite'
  steps:
    # Step 1: Set up Python environment
    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # Step 2: Install Python dependencies
    - name: Install dependencies
      shell: bash
      run: |
        pip install --upgrade pip
        pip install -r "${{ github.action_path }}/requirements.txt"


    # Step 3: Run database analysis using the AI tool
    - name: Run database analysis
      id: ai-analysis
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        LAUNCHDARKLY_SDK_KEY: ${{ inputs.launchdarkly_sdk_key }}
      run: |
        python "${{ github.action_path }}/main.py" --input-file "${{ inputs.input_file }}" > recommendation.txt

    # Step 3.1: Debug content of recommendation.txt
    - name: Debug recommendation content
      shell: bash
      run: |
        echo "Contents of recommendation.txt:"
        cat recommendation.txt || echo "recommendation.txt does not exist."

    # Step 4: Save AI recommendation to output
    # Base64 encoding with no wrapping (to prevent multi-line issues)
    - name: Save recommendation to output
      id: save-recommendation
      shell: bash
      run: |
        if [ -f recommendation.txt ]; then
          recommendation_output=$(cat recommendation.txt | base64 -w 0)
          echo "recommendation_base64=${recommendation_output}" >> $GITHUB_ENV
        else
          echo "No recommendation output generated."
          exit 1
        fi

    # Step 5: Find an existing comment in the PR
    - name: Find Existing Comment
      id: find-comment
      uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e
      with:
        # issue-number: ${{ github.event.pull_request.number }}
        issue-number: ${{ inputs.pull_request_number }}
        body-includes: '### Database Analysis Report'
        token: ${{ inputs.github_token }}
        repository: ${{ github.repository }}

    - name: Decode Recommendation Base64
      id: decode-recommendation
      shell: bash
      run: |
        decoded_recommendation=$(echo "${{ env.recommendation_base64 }}" | base64 --decode)
        printf "decoded_recommendation<<EOF\n%s\nEOF\n" "$decoded_recommendation" >> $GITHUB_OUTPUT

    - name: Create or Update PR Comment
      uses: peter-evans/create-or-update-comment@861c151028fe2c020af613654ca390338aa8fa6f
      with:
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        issue-number: ${{ inputs.pull_request_number }}
        body: |
          ### Database Analysis Report
          ${{ steps.decode-recommendation.outputs.decoded_recommendation }}

        token: ${{ inputs.github_token }}
        edit-mode: 'replace'


# Define outputs to pass data to the workflow
outputs:
  recommendation:
    description: "Recommendation generated by the AI tool."
    value: ${{ env.recommendation_base64 }}